name: Validate and deploy Fit Journey
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fit-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/fit-journey-build
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SESSION_SECRET SETUP_TOKEN; do
            if [ -z "${!key}" ]; then echo "::error::Missing required secret: $key"; exit 1; fi
          done
          if [ "${#SESSION_SECRET}" -lt 32 ] || [ "${#SETUP_TOKEN}" -lt 32 ]; then
            echo "::error::SESSION_SECRET and SETUP_TOKEN must be at least 32 characters"
            exit 1
          fi
          if [ "$SESSION_SECRET" = "$SETUP_TOKEN" ]; then echo "::error::Secrets must be different"; exit 1; fi
      - name: Apply family database migration
        run: npx --yes wrangler@4 d1 execute fit-journey-db --remote --file=db/migration_003_family.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Cloudflare Worker and static assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Provision encrypted Worker authentication secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          umask 077
          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({SESSION_SECRET:process.env.SESSION_SECRET,SETUP_TOKEN:process.env.SETUP_TOKEN,...(process.env.VAPID_PUBLIC_KEY&&process.env.VAPID_PRIVATE_KEY?{VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT||"mailto:fitjourney@example.com"}:{})}))' "$tmpfile"
          npx --yes wrangler@4 secret bulk "$tmpfile" --config wrangler.jsonc

